/* Investment-style performance chart */
.line-chart{height:220px;position:relative;margin-top:8px;overflow:hidden;border-radius:10px;background:linear-gradient(180deg,#fbfdfc 0%,#fff 100%);border:1px solid var(--line)}
.line-chart svg{width:100%;height:100%;display:block}
.chart-grid-line{stroke:#E7ECE9;stroke-width:1}
.chart-line{fill:none;stroke:var(--teal);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.chart-area{fill:url(#investmentFill);opacity:.28}
.chart-dot{fill:#fff;stroke:var(--teal);stroke-width:3}
.chart-axis{font-size:9px;fill:#7A8582}
.chart-legend{display:flex;justify-content:space-between;align-items:center;margin-top:10px;font-size:11px;color:var(--muted)}
.chart-legend strong{color:var(--green)}
.investment-quick{background:var(--green)!important;color:#fff!important;border-color:var(--green)!important}
.task-list{display:flex;flex-direction:column;gap:12px}
.task-row{display:flex;align-items:center;gap:16px;border:1px solid var(--line);background:#fff;border-radius:12px;padding:16px 18px}
.task-row .task-icon{width:42px;height:42px;min-width:42px;border-radius:10px;background:#EAF0ED;color:var(--green);display:grid;place-items:center}
.task-row .task-icon svg{width:23px;height:23px}
.task-content{flex:1;min-width:0}
.task-content h3{margin:0 0 5px;font-size:15px}
.task-content p{margin:0;color:var(--muted);font-size:12px;line-height:1.5}
.task-reward{font-weight:850;color:var(--green);white-space:nowrap}
.task-row .btn{white-space:nowrap}
.investment-single{max-width:760px}
.investment-rate{font-size:42px;font-weight:900;letter-spacing:-2px;color:var(--green);margin:6px 0}
.investment-meta{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:20px 0}
.investment-meta div{border:1px solid var(--line);border-radius:10px;padding:13px}
.investment-meta strong{display:block;margin-top:4px}
@media(max-width:700px){
 .task-row{align-items:flex-start;flex-wrap:wrap}
 .task-content{width:calc(100% - 58px)}
 .task-row .btn{width:100%}
 .investment-meta{grid-template-columns:1fr}
}

/* ValerisBank mobile stability: prevent horizontal swinging/overflow */
html, body {
  width: 100%;
  max-width: 100%;
  overflow-x: hidden;
}
body { min-width: 0; }
img, svg, video, canvas { max-width: 100%; height: auto; }
button, input, select, textarea { max-width: 100%; }
.task-content { min-width: 0; overflow-wrap: anywhere; }
.tablewrap { max-width: 100%; overflow-x: auto; -webkit-overflow-scrolling: touch; }
@media (max-width: 700px) {
  .container { width: calc(100% - 24px); max-width: 100%; }
  .header .container { gap: 10px; }
  .appbar .container { width: calc(100% - 20px); }
  .app-user { min-width: 0; }
  .dashmain { min-width: 0; overflow-x: hidden; }
  .dash-title h1 { font-size: 28px !important; letter-spacing: -1px !important; }
  .stats { grid-template-columns: 1fr !important; }
  .panel-grid { grid-template-columns: 1fr !important; }
  .cards { grid-template-columns: 1fr !important; }
  .quick .btn { flex: 1 1 100%; min-width: 0; }
  .task-row { width: 100%; min-width: 0; }
  .task-content { width: auto; flex: 1 1 calc(100% - 58px); }
  .task-reward { margin-left: 58px; }
  .task-row .btn { flex: 1 1 100%; width: 100%; min-width: 0; }
  .modal { padding: 10px; }
  .modalbox { width: 100%; max-width: 100%; max-height: calc(100vh - 20px); overflow-y: auto; }
  .fund-code-row { display: flex; flex-direction: column; gap: 0; }
  .fund-code-row .code-btn { width: 100%; margin-bottom: 8px; }
  .auth { padding: 12px; }
  .auth-card { padding: 20px; }
  .hero-grid { gap: 28px; }
  .hero p { font-size: 16px; }
}
